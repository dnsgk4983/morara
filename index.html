<!doctype html>
<html lang="ko">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">
    <link rel="stylesheet" href="./css/style.css">
    <title>모라라와 10일</title>
</head>

<body>
    
<!-- 편지형 스플래시 화면 -->

<div id="splash" class="splash">
  <div class="splash__scene" id="splash-scene">
    <img
      class="splash__art"
      src="./assets/images/splash.png"
      alt="모라라가 왕실 정원에서 손을 내밀고 있는 모습"
      draggable="false"
    >

    <div id="crown-target" class="splash__target"></div>

    <img
      id="splash-crown"
      class="splash__crown"
      src="./assets/images/splash_deco.png"
      alt="모라라에게 씌울 왕관"
      draggable="false"
      tabindex="0"
      role="button"
      aria-label="왕관을 모라라에게 씌우기"
    >

    <div class="splash__sparkles" aria-hidden="true">
      <span>✦</span>
      <span>✧</span>
      <span>✦</span>
      <span>✧</span>
      <span>✦</span>
    </div>

    <div class="splash__content">
      <p class="splash__eyebrow">A BIRTHDAY STORY</p>
      <h1 class="splash__title">Dear Morara</h1>
      <p class="splash__subtitle">너에게 닿는 열흘의 이야기</p>

      <div class="splash__actions">
        <p id="splash-hint" class="splash__hint">
          왕관을 모라라에게 씌워주세요
        </p>

        <button
          id="start-story"
          class="splash__start"
          type="button"
          hidden
        >
          이야기 시작하기
        </button>
      </div>

      <p class="splash__footer">
        FAN-MADE BIRTHDAY PROJECT
      </p>
    </div>
  </div>
</div>


    <main class="game">
        <header class="header">
            <div class="profile"><img src="./assets/images/profile.png" alt="임시 프로필">
                <div><strong>모라라 💗</strong><small>온라인 · 팬 제작 가상 스토리</small></div>
            </div>
            <div class="right">
                <div class="stats"><span id="day">DAY 1 / 10</span><span id="affection">💗 0</span></div><button
                    id="restart" title="처음부터">↻</button>
            </div>
        </header>
        <section id="chat" class="chat" aria-live="polite"></section>
        <footer class="footer">
            <div id="choices" class="choices"></div>
            <form id="freeform" class="freeform" hidden><input id="answer" maxlength="160" autocomplete="off"
                    placeholder="답장을 직접 입력하시오..." required><button type="submit">전송</button></form>
            <div id="status" class="status"></div>
        </footer>
    </main>
    <script src="./data/story.js"></script>
    <script src="./js/main.js"></script>
</body>

</html>
