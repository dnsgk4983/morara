<!doctype html>
<html lang="ko">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">
    <link rel="stylesheet" href="./css/style.css">
    <title>모라라와 10일</title>
</head>

<body>
    
<!-- 편지형 스플래시 화면 -->
<div id="splash" class="splash">
  <div class="splash__background"></div>

  <div class="splash__content">
    <p class="splash__eyebrow">
      A BIRTHDAY STORY
    </p>

    <h1 class="splash__title">Dear Morara</h1>

    <p class="splash__subtitle">
      너에게 닿는 열흘의 이야기
    </p>

    <!-- 편지 봉투 -->
    <button
      id="envelope"
      class="envelope"
      type="button"
      aria-label="편지 열기"
      aria-expanded="false"
    >
      <span class="envelope__back"></span>
      <span class="envelope__letter"></span>
      <span class="envelope__front"></span>
      <span class="envelope__flap"></span>
      <span class="envelope__seal">♥</span>
    </button>

    <!-- 편지 내용 -->
    <div id="splash-letter" class="splash-letter">
      <p class="splash-letter__label">TO. YOU</p>

      <h2>작은 이야기가 도착했어요.</h2>

      <p>
        열흘 동안 이어질 특별한 이야기.<br>
        오늘, 첫 번째 페이지를 열어볼까요?
      </p>

      <button
        id="start-story"
        class="splash-letter__start"
        type="button"
      >
        이야기 시작하기
      </button>
    </div>

    <p class="splash__hint">
      봉투를 눌러 편지를 열어보세요
    </p>

    <p class="splash__footer">
      FAN-MADE BIRTHDAY PROJECT
    </p>
  </div>
</div>

    <main class="game">
        <header class="header">
            <div class="profile"><img src="./assets/images/profile.png" alt="임시 프로필">
                <div><strong>모라라 💗</strong><small>온라인 · 팬 제작 가상 스토리</small></div>
            </div>
            <div class="right">
                <div class="stats"><span id="day">DAY 1 / 10</span><span id="affection">💗 0</span></div><button
                    id="restart" title="처음부터">↻</button>
            </div>
        </header>
        <section id="chat" class="chat" aria-live="polite"></section>
        <footer class="footer">
            <div id="choices" class="choices"></div>
            <form id="freeform" class="freeform" hidden><input id="answer" maxlength="160" autocomplete="off"
                    placeholder="답장을 직접 입력하시오..." required><button type="submit">전송</button></form>
            <div id="status" class="status"></div>
        </footer>
    </main>
    <script src="./data/story.js"></script>
    <script src="./js/main.js"></script>
</body>

</html>
